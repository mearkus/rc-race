name: Deploy to mearkus.com/rc-racer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-rc-racer
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to mearkus.github.io under rc-racer/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: mearkus/mearkus.github.io
          branch: main
          folder: .
          target-folder: rc-racer
          token: ${{ secrets.DEPLOY_TOKEN }}
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
          clean: true
